[project]
name = "aprendizaje-automatico-avanzado"
version = "0.1.0"
description = "Ejemplos y ejercicios de aprendizaje automático avanzado (supervisado, no supervisado, por refuerzo)"
readme = "README.md"
authors = [
    { name = "Hernan", email = "hernanivan.montoya@gmail.com" }
]
requires-python = ">=3.11"

dependencies = [
    "gymnasium>=1.3.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.9.2",
    "nltk>=3.9.1",
    "numpy>=2.4.6",
    "pandas>=2.2.2",
    "python-dotenv>=1.2.4",
    "requests>=2.32.3",
    "scikit-learn>=1.5.2",
    "seaborn>=0.13.2",
    "stable-baselines3>=2.9.0",
    "torch>=2.14.1",
    "torchaudio>=2.11.0",
    "torchvision>=0.29.1",
]

[project.scripts]
aaa = "aprendizaje_automatico_avanzado.aaa:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

